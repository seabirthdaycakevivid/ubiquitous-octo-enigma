name: Instance
on: workflow_dispatch
concurrency:
  group: Instance_Mutex
  cancel-in-progress: true
jobs:
  Instance_Job:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INSTANCE: ${{ secrets.INSTANCE }}
        run: echo "$INSTANCE" | jq -r ".[0]" | openssl base64 -d -A | bash
